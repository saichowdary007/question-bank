services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./temp_uploads:/app/temp_uploads
      - ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
      mongo:
        condition: service_started
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MONGODB_URI=${MONGO_URI}
      - CONCURRENT_REQUESTS=2
      - OLLAMA_REQUEST_TIMEOUT=600
      - AWS_REGION=${AWS_REGION:-us-east-2}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-pdf-question-bank}
      - SQS_DLQ_URL=${SQS_DLQ_URL:-YOUR_SQS_DLQ_URL}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-YOUR_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-YOUR_SECRET_KEY}
      - PROCESSING_TIMEOUT=${PROCESSING_TIMEOUT:-900}
      - MAX_RETRY_ATTEMPTS=${MAX_RETRY_ATTEMPTS:-3}

  ollama:
    image: ollama/ollama
    env_file:
      - .env
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_NUM_PARALLEL=2

  # Service to pull the mistral model
  ollama-setup:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["sh", "-c", "echo 'Pulling mistral model...' && OLLAMA_HOST=http://ollama:11434 ollama pull mistral && echo 'Mistral model ready!'"]
    restart: "no"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=question_bank

volumes:
  ollama_data:
  mongo_data: