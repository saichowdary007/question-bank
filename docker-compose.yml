services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./temp_uploads:/app/temp_uploads
      - ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
      mongo:
        condition: service_started
    environment:
      - OLLAMA_HOST=host.docker.internal
      - MONGODB_URI=mongodb+srv://question_bank:huH88r0YRTUrdwuM@cluster0.maske42.mongodb.net/?retryWrites=true&w=majority&appName=Cluster0
      - CONCURRENT_REQUESTS=2
      - OLLAMA_REQUEST_TIMEOUT=600

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      - OLLAMA_HOST=ollama
      - MONGODB_URI=mongodb+srv://question_bank:huH88r0YRTUrdwuM@cluster0.maske42.mongodb.net/?retryWrites=true&w=majority&appName=Cluster0
      - OLLAMA_NUM_PARALLEL=2

  # Service to pull the mistral model
  ollama-setup:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=ollama
    command: >
      sh -c "
        echo 'Pulling mistral model...' &&
        ollama pull mistral --host http://ollama:11434 &&
        echo 'Mistral model ready!'
      "
    restart: "no"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=question_bank

volumes:
  ollama_data:
  mongo_data: 